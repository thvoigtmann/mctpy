[tox]
requires =
    tox>=4
#env_list = lint, types, py{314}
env_list = py{314}

[testenv]
description = run unit tests
#commands =
#    python3 -m unittest discover --start tests --buffer
commands =
    coverage run --source=mctpy -m pytest --junit-xml=tests/pytest_results.xml tests/
deps =
    pytest
    coverage
    -rrequirements.txt

[testenv:lint]
description = run linters
skip_install = true
deps =
    black>=22.12
commands = black --check {posargs:.}

[testenv:types]
description = run type checks
deps =
    mypy>=1.4.1
commands =
    mypy .

[coverage:report]
exclude_also =
    @njit
